<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunny With A Chance Pet Care</title>
    <script type="module" crossorigin src="/sunnyside-pet-care/assets/index-wyMR1MqC.js"></script>
    <link rel="stylesheet" crossorigin href="/sunnyside-pet-care/assets/index-DcNed2lk.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const query = window.location.search

        if (query.startsWith('?/')) {
          const route = query
            .slice(1)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?')

          window.history.replaceState(null, '', window.location.pathname.slice(0, -1) + route + window.location.hash)
        }
      })()
    </script>
  </body>
</html>
