spring.application.name=sunnyside-pet-care

# Use in-memory H2 for local development
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port
server.port=${PORT:8080}

# CORS allowed origins (comma-separated for multiple, or * for all)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,https://tbones321.github.io

# Multipart configuration for file uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB