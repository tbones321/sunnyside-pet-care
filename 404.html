<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        const location = window.location
        const basePath = location.pathname.split('/').slice(0, 2).join('/')
        const route = location.pathname.slice(basePath.length).replace(/&/g, '~and~')
        const query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : ''

        location.replace(basePath + '/?' + route + query + location.hash)
      })()
    </script>
  </head>
  <body></body>
</html>
